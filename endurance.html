<!DOCTYPE html>
<html lang="de" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grob G115B — Flugdauer</title>
  <meta name="theme-color" content="#005f8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="G115B Perf">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/calculator.css">
</head>

<body>
  <nav class="nav-bar" style="position:relative">
    <div style="position:relative;justify-self:start;">
      <button class="nav-menu-btn" id="navMenuBtn" onclick="toggleMenu()">
        <span class="nav-back-arrow">‹</span> Rechner
      </button>
      <div class="nav-dropdown" id="navDropdown"><a href="index.html" class="nav-dropdown-home">← Übersicht</a>
        <a href="takeoff.html">Startstrecke</a>
        <a href="landing.html">Landestrecke</a>
        <a href="cruise.html">Reiseflug</a>
        <a href="climb.html">Steigflug</a>
        <a href="climb_rate.html">Steiggeschwindigkeit</a>
        <a href="range.html">Reichweite</a>
        <a href="endurance.html" class="current">Maximale Flugdauer</a>
        <a href="stall.html">Überziehgeschwindigkeit</a>
      </div>
    </div>
    <div class="nav-center">
      <div class="nav-logo">G115B</div>
      <div class="nav-title">Maximale Flugdauer</div>
    </div>
    <div class="nav-right">
      <div class="theme-toggle" onclick="toggleTheme()">
        <div class="toggle-track" id="tTrack">
          <div class="toggle-thumb" id="tThumb"></div>
        </div>
        <span id="tLabel">Light</span>
      </div>
    </div>
  </nav>
  <div class="page-layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="section-header">Kraftstoff</div>
        <div class="field">
          <div class="field-label">Kraftstoffmenge <span>l · max. 107 l</span></div>
          <div class="slider-row"><input type="range" id="fuel-range" min="0" max="107" step="1" value="70"
              oninput="syncSlider('fuel','fuel-range')"><span class="slider-val" id="fuel-range-val">70 l</span></div>
          <div class="input-wrap" style="margin-top:6px"><input type="number" id="fuel" value="70" step="1" min="0"
              max="107" onfocus="this.select()" onkeydown="if(event.key==='Enter')this.blur()"
              oninput="syncInput('fuel','fuel-range')"><span class="unit">l</span></div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="section-header">Leistung</div>
        <div class="field">
          <div class="field-label">Leistung <span>%</span></div>
          <div class="slider-row"><input type="range" id="pwr-range" min="45" max="75" step="1" value="55"
              oninput="syncSlider('pwr','pwr-range')"><span class="slider-val" id="pwr-range-val">55 %</span></div>
          <div class="input-wrap" style="margin-top:6px"><input type="number" id="pwr" value="55" step="1" min="45"
              max="75" onfocus="this.select()" onkeydown="if(event.key==='Enter')this.blur()"
              oninput="syncInput('pwr','pwr-range')"><span class="unit">%</span></div>
          <div class="hint">45–75% · Lean-Limit · POH Kap. 4.11</div>
        </div>
      </div>
    </aside>
    <div class="results" id="rp"></div>
  </div>
  <script src="js/g115b-core.js"></script>
  <script src="js/g115b-ui.js"></script>
  <script src="js/performance-data.js"></script>
  <script src="js/g115b-calculators.js"></script>
  <script src="js/pages/endurance-page.js"></script>
  <script src="app.js"></script>
</body>

</html>
