<!DOCTYPE html>
<html lang="de" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grob G115B — Reiseflug</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg-app: #0f1520;
      --bg-nav: #1a2232;
      --bg-card: #1e2b3f;
      --bg-input: #131d2e;
      --bg-active: #273650;
      --border: #2c3e5c;
      --border2: #3a5278;
      --text: #eceff4;
      --text-sub: #a8bacf;
      --text-dim: #5a7a9a;
      --cyan: #00c8f5;
      --cyan-dim: #0099c0;
      --cyan-bg: rgba(0, 200, 245, 0.08);
      --green: #23d160;
      --amber: #f5a623;
      --red: #e53935;
    }

    :root[data-theme="light"] {
      --bg-app: #f0f4f9;
      --bg-nav: #ffffff;
      --bg-card: #ffffff;
      --bg-input: #e4ecf4;
      --bg-active: #d4e4f0;
      --border: #c0d0e0;
      --border2: #90b0cc;
      --text: #0f1c2e;
      --text-sub: #2a4060;
      --text-dim: #5a7a9a;
      --cyan: #005f8a;
      --cyan-dim: #004466;
      --cyan-bg: rgba(0, 95, 138, 0.10);
      --green: #136b2e;
      --amber: #8a5000;
      --red: #a01010;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg-app);
      color: var(--text);
      font-family: 'Nunito Sans', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    /* NAV */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--bg-nav);
      border-bottom: 2px solid var(--cyan);
      padding: 0 1.25rem;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .nav-logo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 3px 8px;
      border-radius: 3px;
    }

    .nav-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .nav-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-left: 0.5rem;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      transition: all 0.15s;
      user-select: none;
    }

    .theme-toggle:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .toggle-track {
      width: 28px;
      height: 16px;
      background: var(--border2);
      border-radius: 8px;
      position: relative;
      transition: background 0.2s;
    }

    .toggle-track.on {
      background: var(--cyan);
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle-thumb.on {
      transform: translateX(12px);
    }

    .nav-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--bg-app);
      background: var(--cyan);
      padding: 3px 8px;
      border-radius: 3px;
    }

    .nav-back {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: all 0.15s;
    }

    .nav-back:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    /* LAYOUT — desktop: sidebar + results side by side, mobile: stacked */
    .page-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      align-items: start;
    }

    .sidebar {
      background: var(--bg-nav);
      border-right: 1px solid var(--border);
      position: sticky;
      top: 52px;
      max-height: calc(100vh - 52px);
      overflow-y: auto;
    }

    .results {
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media(max-width:800px) {
      .page-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        max-height: none;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .nav-sub {
        display: none;
      }
    }

    /* SIDEBAR */
    .sidebar-section {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-section:last-child {
      border-bottom: none;
    }

    .section-header {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 0.875rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-header::before {
      content: '';
      display: block;
      width: 3px;
      height: 14px;
      background: var(--cyan);
      border-radius: 2px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 0.75rem;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .field-label span {
      color: var(--text-dim);
      font-weight: 400;
      text-transform: none;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input[type=number] {
      width: 100%;
      padding: 8px 44px 8px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Nunito Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      -moz-appearance: textfield;
      transition: border-color 0.15s, background 0.15s;
    }

    .input-wrap input[type=number]::-webkit-inner-spin-button,
    .input-wrap input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }

    .input-wrap input[type=number]:focus {
      outline: none;
      border-color: var(--cyan);
      background: var(--bg-active);
    }

    .unit {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      pointer-events: none;
    }

    .hint {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 2px;
      line-height: 1.5;
    }

    .mode-toggle {
      display: grid;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 0.75rem;
    }

    .mode-btn {
      background: transparent;
      border: none;
      padding: 7px 4px;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
      border-right: 1px solid var(--border);
    }

    .mode-btn:last-child {
      border-right: none;
    }

    .mode-btn.active {
      background: var(--cyan-bg);
      color: var(--cyan);
    }

    .mode-btn:hover:not(.active) {
      background: var(--bg-active);
      color: var(--text-sub);
    }

    .pa-mode {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .derived-box {
      background: var(--cyan-bg);
      border: 1px solid var(--cyan-dim);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .derived-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cyan-dim);
    }

    .derived-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--cyan);
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 3px;
      background: var(--border2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      padding: 0;
      border: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--cyan);
      border: 2px solid var(--bg-nav);
      cursor: pointer;
      transition: transform 0.1s;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-row input[type=range] {
      flex: 1;
    }

    .slider-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      min-width: 50px;
      text-align: right;
    }

    /* CARDS */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }

    .card-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title::before {
      content: '';
      display: block;
      width: 3px;
      height: 12px;
      background: var(--cyan);
      border-radius: 2px;
    }

    /* WARNINGS */
    .warnings {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .warn-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: rgba(245, 166, 35, 0.08);
      border-left: 3px solid var(--amber);
      border-radius: 0 6px 6px 0;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--amber);
      font-weight: 600;
    }

    .warn-item.danger {
      border-left-color: var(--red);
      background: rgba(229, 57, 53, 0.08);
      color: var(--red);
    }

    .warn-item::before {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
      margin-top: 5px;
    }

    /* DISCLAIMER CARD */
    .disclaimer-card {
      background: #e8820a;
      border: none;
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }

    .disclaimer-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.5);
      margin-bottom: 4px;
    }

    .disclaimer-text {
      font-size: 13px;
      color: #000;
      font-weight: 600;
      line-height: 1.6;
    }

    /* ATMOS */
    .atmos-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .atmos-item {
      background: var(--bg-input);
      border-radius: 8px;
      padding: 10px 12px;
      border: 1px solid var(--border);
    }

    .atmos-item-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .atmos-item-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .atmos-item-value.warn {
      color: var(--amber);
    }

    .atmos-item-value.good {
      color: var(--green);
    }

    /* PIPELINE */
    .pipeline {
      display: flex;
      flex-direction: column;
    }

    .step {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      align-items: stretch;
      gap: 0 10px;
    }

    .step-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
      background: var(--border2);
      border: 2px solid var(--border2);
    }

    .step-dot.active {
      background: var(--cyan);
      border-color: var(--cyan);
      box-shadow: 0 0 6px rgba(0, 200, 245, 0.4);
    }

    .step-line {
      width: 1px;
      flex: 1;
      background: var(--border);
      margin: 3px 0;
    }

    .step-body {
      padding: 0 0 1rem;
    }

    .step-name {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cyan-dim);
      margin-bottom: 2px;
    }

    .step-detail {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .step-val {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      padding: 0 0 1rem;
      white-space: nowrap;
      align-self: start;
      padding-top: 2px;
    }

    /* RESULTS */
    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .result-item {
      background: var(--cyan-bg);
      border: 1px solid var(--cyan-dim);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }

    .result-item-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cyan-dim);
      margin-bottom: 6px;
    }

    .result-item-value {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--cyan);
      line-height: 1;
    }

    .result-item-value span {
      font-size: 1.1rem;
      color: var(--cyan-dim);
    }

    .result-item-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .speed-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .speed-item {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.875rem 1rem;
    }

    .speed-item-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .speed-item-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .speed-item-value span {
      font-size: 1rem;
      color: var(--text-dim);
    }

    .speed-item-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 3px;
    }

    .conditions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px 12px;
    }

    .conditions-grid span {
      font-size: 11px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .conditions-grid span::before {
      content: '';
      display: block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--cyan);
      flex-shrink: 0;
    }

    .climb-cols {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
    }

    .climb-arrow {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--cyan-dim);
    }

    .breakdown-table {
      width: 100%;
      border-collapse: collapse;
    }

    .breakdown-table td {
      font-size: 12px;
      padding: 3px 0;
    }

    .breakdown-table td:first-child {
      color: var(--text-sub);
    }

    .breakdown-table td:last-child {
      text-align: right;
      font-weight: 700;
      color: var(--text);
    }

    @media(max-width:480px) {
      .result-grid {
        grid-template-columns: 1fr;
      }

      .speed-grid {
        grid-template-columns: 1fr;
      }

      .atmos-grid {
        grid-template-columns: 1fr;
      }

      .conditions-grid {
        grid-template-columns: 1fr;
      }

      .climb-cols {
        grid-template-columns: 1fr;
      }

      .climb-arrow {
        transform: rotate(90deg);
      }

      .result-item-value {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>
  <nav class="nav-bar">
    <div class="nav-left">
      <div class="nav-logo">G115B</div>
      <div><span class="nav-title">Reiseflug</span><span class="nav-sub">POH 5.3.10 · 5.3.11 · 5.3.12</span></div>
    </div>
    <div class="nav-right">
      <div class="theme-toggle" onclick="toggleTheme()">
        <div class="toggle-track" id="tTrack">
          <div class="toggle-thumb" id="tThumb"></div>
        </div>
        <span id="tLabel">Dark</span>
      </div>
      <a href="index.html" class="nav-back">← Back</a>
      <div class="nav-badge">AFM / POH</div>
    </div>
  </nav>
  <div class="page-layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="section-header">Höhe</div>
        <div class="mode-toggle" style="grid-template-columns:1fr 1fr 1fr">
          <button class="mode-btn active" id="mode-alt-btn" onclick="setMode('alt')">Altitude</button>
          <button class="mode-btn" id="mode-fl-btn" onclick="setMode('fl')">Flight Level</button>
          <button class="mode-btn" id="mode-da-btn" onclick="setMode('da')">Density Alt.</button>
        </div>
        <div id="mode-alt" class="pa-mode">
          <div class="field">
            <div class="field-label">Flughöhe <span>ft</span></div>
            <div class="input-wrap"><input type="number" id="alt" value="6000" step="100" onfocus="this.select()"
                onkeydown="if(event.key==='Enter')this.blur()" oninput="calcDA()"><span class="unit">ft</span></div>
          </div>
          <div class="field">
            <div class="field-label">QNH <span>hPa</span></div>
            <div class="input-wrap"><input type="number" id="qnh" value="1013" step="1" min="900" max="1100"
                onfocus="this.select()" onkeydown="if(event.key==='Enter')this.blur()" oninput="calcDA()"><span
                class="unit">hPa</span></div>
          </div>
        </div>
        <div id="mode-fl" class="pa-mode" style="display:none">
          <div class="field">
            <div class="field-label">Flight Level</div>
            <div class="input-wrap"><input type="number" id="fl" value="60" step="5" onfocus="this.select()"
                onkeydown="if(event.key==='Enter')this.blur()" oninput="calcDA()"><span class="unit">FL</span></div>
          </div>
        </div>
        <div id="mode-da" class="pa-mode" style="display:none">
          <div class="field">
            <div class="field-label">Density Altitude <span>ft</span></div>
            <div class="input-wrap"><input type="number" id="da-direct" value="6000" step="100" onfocus="this.select()"
                onkeydown="if(event.key==='Enter')this.blur()" oninput="calcDA()"><span class="unit">ft</span></div>
          </div>
        </div>
        <div class="field" id="oat-field">
          <div class="field-label">OAT <span>°C</span></div>
          <div class="input-wrap"><input type="number" id="oat" value="0" step="1" onfocus="this.select()"
              onkeydown="if(event.key==='Enter')this.blur()" oninput="calcDA()"><span class="unit">°C</span></div>
        </div>
        <div class="derived-box" id="da-box">
          <div class="derived-label">Density Altitude</div>
          <div class="derived-value" id="da-val">— ft</div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="section-header">Leistung</div>
        <div class="field">
          <div class="field-label">Leistung <span>%</span></div>
          <div class="slider-row"><input type="range" id="pwr-range" min="45" max="100" step="1" value="65"
              oninput="syncSlider('pwr','pwr-range')"><span class="slider-val" id="pwr-range-val">65 %</span></div>
          <div class="input-wrap" style="margin-top:6px"><input type="number" id="pwr" value="65" step="1" min="45"
              max="100" onfocus="this.select()" onkeydown="if(event.key==='Enter')this.blur()"
              oninput="syncInput('pwr','pwr-range')"><span class="unit">%</span></div>
          <div class="hint">Vollgas = 100% · Leistungseinstellung POH Abschnitt 4</div>
        </div>
      </div>
    </aside>
    <div class="results" id="rp"></div>
  </div>
  <script>

    function initTheme() { const t = localStorage.getItem('g115b-theme') || 'light'; document.documentElement.dataset.theme = t; const on = t === 'dark'; document.getElementById('tTrack').classList.toggle('on', on); document.getElementById('tThumb').classList.toggle('on', on); document.getElementById('tLabel').textContent = on ? 'Dark' : 'Light'; }
    function toggleTheme() { const d = document.documentElement.dataset.theme === 'dark'; const t = d ? 'light' : 'dark'; document.documentElement.dataset.theme = t; localStorage.setItem('g115b-theme', t); document.getElementById('tTrack').classList.toggle('on', !d); document.getElementById('tThumb').classList.toggle('on', !d); document.getElementById('tLabel').textContent = d ? 'Light' : 'Dark'; }


    function lookup2D(t, x1, x2) { const { bp1, bp2, data } = t; let i0 = 0, i1 = 0, j0 = 0, j1 = 0; if (x1 <= bp1[0]) { i0 = i1 = 0; } else if (x1 >= bp1[bp1.length - 1]) { i0 = i1 = bp1.length - 1; } else { for (let i = 0; i < bp1.length - 1; i++)if (x1 >= bp1[i] && x1 <= bp1[i + 1]) { i0 = i; i1 = i + 1; break; } } if (x2 <= bp2[0]) { j0 = j1 = 0; } else if (x2 >= bp2[bp2.length - 1]) { j0 = j1 = bp2.length - 1; } else { for (let j = 0; j < bp2.length - 1; j++)if (x2 >= bp2[j] && x2 <= bp2[j + 1]) { j0 = j; j1 = j + 1; break; } } const t1 = (i0 === i1) ? 0 : (x1 - bp1[i0]) / (bp1[i1] - bp1[i0]); const t2 = (j0 === j1) ? 0 : (x2 - bp2[j0]) / (bp2[j1] - bp2[j0]); const v0 = data[i0][j0] + t2 * (data[i0][j1] - data[i0][j0]); const v1 = data[i1][j0] + t2 * (data[i1][j1] - data[i1][j0]); return v0 + t1 * (v1 - v0); }
    function interp1D(bp, vals, x) { if (x <= bp[0]) return vals[0]; if (x >= bp[bp.length - 1]) return vals[bp.length - 1]; for (let i = 0; i < bp.length - 1; i++)if (x >= bp[i] && x <= bp[i + 1]) { const t = (x - bp[i]) / (bp[i + 1] - bp[i]); return vals[i] + t * (vals[i + 1] - vals[i]); } return vals[vals.length - 1]; }
    function densityAltitude(pa, oat) { const isa = 15 - 1.98 * (pa / 1000); const dev = oat - isa; return { da: Math.round(pa + 120 * dev), isadev: dev }; }
    const fmt = v => Math.round(v);
    const fmtS = v => (v >= 0 ? '+' : '') + v.toFixed(1);
    function syncSlider(iId, rId) { const v = document.getElementById(rId).value; document.getElementById(iId).value = v; updateLbl(rId, v); }
    function syncInput(iId, rId) { const v = document.getElementById(iId).value; document.getElementById(rId).value = v; updateLbl(rId, v); }
    function updateLbl(rId, v) { const el = document.getElementById(rId + '-val'); if (!el) return; const u = { 'slope-range': ' %', 'wind-range': ' kt', 'zuschl-range': ' %', 'pwr-range': ' %', 'fuel-range': ' l', 'mass-range': ' kg' }; const d = { 'slope-range': 1, 'wind-range': 0, 'zuschl-range': 0, 'pwr-range': 0, 'fuel-range': 0, 'mass-range': 0 }; el.textContent = parseFloat(v).toFixed(d[rId] ?? 0) + (u[rId] || ''); }


    let curMode = 'alt';
    function setMode(m) {
      curMode = m;
      ['alt', 'fl', 'da'].forEach(k => {
        document.getElementById('mode-' + k).style.display = k === m ? 'flex' : 'none';
        document.getElementById('mode-' + k + '-btn').classList.toggle('active', k === m);
      });
      const needOAT = m !== 'da';
      document.getElementById('oat-field').style.display = needOAT ? 'flex' : 'none';
      document.getElementById('da-box').style.display = needOAT ? 'flex' : 'none';
      calcDA();
    }
    function calcDA() {
      let da;
      if (curMode === 'da') { da = parseFloat(document.getElementById('da-direct').value) || 0; }
      else {
        let pa;
        if (curMode === 'alt') { const a = parseFloat(document.getElementById('alt').value) || 0; const q = parseFloat(document.getElementById('qnh').value) || 1013; pa = Math.round(a + (1013.25 - q) * 27); }
        else { pa = (parseFloat(document.getElementById('fl').value) || 0) * 100; }
        const raw = document.getElementById('oat').value; const oat = raw === '' ? 15 : parseFloat(raw);
        const r = densityAltitude(pa, oat); da = r.da;
        document.getElementById('da-val').textContent = da.toLocaleString('de-DE') + ' ft';
      }
      window._da = da; calculate(da);
    }

    const RPM_TABLE = { data: [[2150, 2175, 2200, 2225, 2250, 2280, 2310, 2340, 2370, 2400, 2430], [2280, 2310, 2340, 2370, 2400, 2430, 2460, 2490, 2520, 2550, 2580], [2400, 2430, 2460, 2490, 2520, 2550, 2580, 2610, 2640, 2670, 2695], [2530, 2555, 2580, 2600, 2625, 2650, 2670, 2690, 2700, 2700, 2700], [2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700, 2700]], bp1: [45, 55, 65, 75, 100], bp2: [0, 2000, 4000, 6000, 8000, 10000, 12000, 14000, 16000, 18000, 20000] };
    const FUEL_BP = [45, 55, 65, 75], FUEL_LPH = [20.4, 24.2, 28.8, 33.3];
    const KML_TABLE = { data: [[8.80, 9.00, 9.20, 9.40, 9.60, 9.80, 9.95, 9.95, 9.95, 9.95, 9.95], [8.00, 8.15, 8.30, 8.45, 8.60, 8.75, 8.85, 8.90, 8.90, 8.90, 8.90], [7.10, 7.25, 7.40, 7.55, 7.70, 7.82, 7.90, 7.95, 7.95, 7.95, 7.95], [6.30, 6.42, 6.54, 6.65, 6.76, 6.85, 6.90, 6.90, 6.90, 6.90, 6.90]], bp1: [45, 55, 65, 75], bp2: [0, 2000, 4000, 6000, 8000, 10000, 12000, 14000, 16000, 18000, 20000] };
    const TAS_TABLE = { data: [[175, 178, 181, 184, 187, 190, 193, 196, 199, 202, 205], [190, 194, 198, 202, 206, 210, 214, 218, 222, 226, 230], [204, 209, 213, 218, 222, 227, 231, 235, 239, 243, 247], [218, 223, 228, 233, 237, 241, 245, 248, 250, 250, 250], [240, 244, 247, 249, 250, 250, 250, 250, 250, 250, 250]], bp1: [45, 55, 65, 75, 100], bp2: [0, 2000, 4000, 6000, 8000, 10000, 12000, 14000, 16000, 18000, 20000] };
    function calculate(da) {
      if (da === undefined) return;
      const pwr = parseFloat(document.getElementById('pwr').value) || 65;
      const raw = document.getElementById('oat').value; const oat = raw === '' ? 0 : parseFloat(raw);
      let pa = 0, isadev = 0;
      if (curMode === 'alt') { const a = parseFloat(document.getElementById('alt').value) || 0; const q = parseFloat(document.getElementById('qnh').value) || 1013; pa = Math.round(a + (1013.25 - q) * 27); }
      else if (curMode === 'fl') { pa = (parseFloat(document.getElementById('fl').value) || 0) * 100; }
      if (curMode !== 'da') isadev = densityAltitude(pa, oat).isadev;
      const rpm = lookup2D(RPM_TABLE, pwr, da);
      const fuelLph = interp1D(FUEL_BP, FUEL_LPH, Math.min(pwr, 75));
      const tas = lookup2D(TAS_TABLE, pwr, da); const tasKt = tas / 1.852;
      const nml = tasKt / fuelLph;
      const pLbl = pwr >= 100 ? 'Vollgas' : `${pwr}%`;
      document.getElementById('rp').innerHTML =
        `<div class="disclaimer-card"><div class="disclaimer-tag">⚠ Wichtiger Hinweis</div><div class="disclaimer-text">Diese Anwendung ersetzt nicht das originale, zugelassene AFM/POH der jeweiligen Maschine. Die Verantwortung für alle Flugentscheidungen liegt ausschließlich beim Piloten.</div></div>`
        + (curMode !== 'da' ? `<div class="card"><div class="card-title">Atmosphäre</div><div class="atmos-grid">
      <div class="atmos-item"><div class="atmos-item-label">Density Altitude</div><div class="atmos-item-value ${da > 10000 ? 'warn' : ''}">${da.toLocaleString('de-DE')} ft</div></div>
      <div class="atmos-item"><div class="atmos-item-label">ISA-Abweichung</div><div class="atmos-item-value ${Math.abs(isadev) >= 0.1 ? (isadev > 0 ? 'warn' : 'good') : ''}">${fmtS(isadev)} °C</div></div>
    </div></div>`: '')
        + `<div class="card"><div class="card-title">Ergebnis — ${pLbl} Leistung · DA ${da.toLocaleString('de-DE')} ft</div><div class="result-grid">
      <div class="result-item"><div class="result-item-label">Drehzahl · POH 5.3.11</div><div class="result-item-value">${Math.round(rpm)} <span>rpm</span></div></div>
      <div class="result-item"><div class="result-item-label">Fuel Flow · POH 5.3.10</div><div class="result-item-value">${fuelLph.toFixed(1)} <span>l/h</span></div><div class="result-item-sub">${nml.toFixed(2)} nm/l</div></div>
      <div class="result-item"><div class="result-item-label">TAS · POH 5.3.12</div><div class="result-item-value">${tasKt.toFixed(1)} <span>kt</span></div><div class="result-item-sub">${Math.round(tas)} km/h</div></div>
    </div></div>`
        ;
    }
    document.addEventListener('DOMContentLoaded', () => { calcDA(); document.querySelector('.sidebar').addEventListener('input', calcDA); });

    document.addEventListener('DOMContentLoaded', () => { initTheme(); });
  </script>
</body>

</html>
